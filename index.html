<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15171c">
<title>Префлоп-тренажёр</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head><body>
<h1>Префлоп-тренажёр</h1>

<section id="v-quiz">
  <div class="card">
    <div class="dim">Набор спотов для тренировки</div>
    <select id="preset"></select>
    <details style="margin-top:8px">
      <summary class="dim">Выбрать споты вручную</summary>
      <div id="spotList" style="max-height:220px;overflow:auto;margin-top:6px"></div>
    </details>
    <div class="dim" id="setInfo" style="margin-top:8px"></div>
    <div class="hand" id="hand">—</div>
    <div class="spot" id="spot"></div>
    <div class="btns" id="btns"></div>
    <div class="res" id="res"></div>
  </div>
  <div class="card">
    <button id="showChart" style="width:100%;padding:10px;border-radius:9px;border:1px solid #313643;background:#262a34;color:#e8eaf0">Показать чарт этого спота</button>
    <div id="chartBox" style="display:none;margin-top:10px"></div>
  </div>
  <div class="card"><h2 style="margin-top:0">Счёт</h2><div id="score" class="dim"></div></div>
</section>

<section id="v-charts" style="display:none">
  <div class="card"><select id="scen2"></select></div>
  <div class="card" id="chartFull"></div>
  <div class="card"><div class="dim">Нажми на клетку — покажу, что велит чарт для этой руки.</div><div id="cellInfo" class="dim"></div></div>
</section>

<section id="v-err" style="display:none">
  <div class="card"><h2 style="margin-top:0">Где я чаще ошибаюсь</h2><div id="errList" class="dim"></div></div>
  <div class="card"><button id="resetErr" style="width:100%;padding:10px;border-radius:9px;border:1px solid #313643;background:#262a34;color:#e8eaf0">Обнулить статистику ошибок</button></div>
</section>

<section id="v-progress" style="display:none">
  <div class="card"><h2 style="margin-top:0">Прогресс по дням</h2><div id="progress" class="dim"></div></div>
</section>

<div id="tabs">
  <button data-v="quiz" class="on">Тренировка</button>
  <button data-v="charts">Чарты</button>
  <button data-v="err">Ошибки</button>
  <button data-v="progress">Прогресс</button>
  </div>
<button id="updateApp" style="width:100%;padding:10px;border-radius:9px;border:1px solid #313643;background:#262a34;color:#e8eaf0;margin-bottom:10px">Обновить приложение</button>
<div id="foot">Версия: <span id="ver">—</span> · Диапазоны — ручная разметка автора тренажёра (не выгрузка солвера, без частот). Для личного использования.</div>
<script src="ranges.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body></html>
